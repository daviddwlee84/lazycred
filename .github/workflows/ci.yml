name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: astral-sh/setup-uv@v6
      - name: Linux smart-card build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev swig
      - run: make check race pty
